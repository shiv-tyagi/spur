# Server 1: 149.28.118.43
# Samsung 3.5TB NVMe (kernel: nvme0n1, confirmed blank)
spur_ci_disk_by_id: /dev/disk/by-id/nvme-SAMSUNG_MZWLO3T8HCLS-00A07_S794NG0X618327

# GPU VF PCI addresses per GPU slot (populated by: ansible-playbook discover-vfs.yml).
# Order matches the slot's gpus_per_vm layout "0,1,1,1": VFs are consumed left-to-right,
# one per node (VM1, VM2, VM3). 3 VFs per cluster, 2 clusters = 6 of 8 VFs (2 spare).
ci_slot_vfs:
  gpu-1: "0000:05:02.0,0000:27:02.0,0000:47:02.0"
  gpu-2: "0000:65:02.0,0000:85:02.0,0000:a7:02.0"
