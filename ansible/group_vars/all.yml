# Spur CI Infrastructure - shared variables
# All values are per-server unless overridden in host_vars.

# --- Storage ---
# Target NVMe for /var/lib/spur-ci. Selected by stable /dev/disk/by-id path.
# Set per-host in host_vars. provision_disk must be explicitly true to format.
spur_ci_mount: /var/lib/spur-ci
provision_disk: false

# --- Slot definitions ---
# Each slot is a static resource partition: an isolated network, own instance dir,
# and (for GPU slots) pinned GPU VFs. There are two shapes:
#   gpu    - cluster: 4 VMs, GPUs laid out 0,1,1,1 (driver + 3 nodes x 1 GPU) = 3 VFs.
#            One GPU per node: only single-VF passthrough, which avoids the large-BAR
#            (2x256 GiB) firmware hang seen when two VFs share one VM.
#   non-gpu - default cluster: 4 VMs, no GPUs (runs the bulk of the suite + k8s).
# Fields:
#   type         gpu | cpu
#   node_count   VMs in the cluster (driver + compute nodes)
#   gpus_per_vm  passed to cluster-up.sh --gpus-per-vm (scalar or per-VM comma list)
#   labels       GitHub Actions runner labels
#   gpu_vfs      pinned VF PCI addresses (GPU slots only; from host_vars)
ci_slots:
  gpu-1:
    type: gpu
    node_count: 4
    gpus_per_vm: "0,1,1,1"
    labels: "self-hosted,spur-e2e,gpu"
    gpu_vfs: "{{ ci_slot_vfs['gpu-1'] }}"
    network_name: spurci-gpu-1
    network_subnet: 10.44.1.0/24
    network_gateway: 10.44.1.1
    network_dhcp_start: 10.44.1.10
    network_dhcp_end: 10.44.1.50
  gpu-2:
    type: gpu
    node_count: 4
    gpus_per_vm: "0,1,1,1"
    labels: "self-hosted,spur-e2e,gpu"
    gpu_vfs: "{{ ci_slot_vfs['gpu-2'] }}"
    network_name: spurci-gpu-2
    network_subnet: 10.44.2.0/24
    network_gateway: 10.44.2.1
    network_dhcp_start: 10.44.2.10
    network_dhcp_end: 10.44.2.50
  nogpu-01:
    type: cpu
    node_count: 4
    gpus_per_vm: "0"
    labels: "self-hosted,spur-e2e,non-gpu"
    gpu_vfs: ""
    network_name: spurci-nogpu-01
    network_subnet: 10.44.3.0/24
    network_gateway: 10.44.3.1
    network_dhcp_start: 10.44.3.10
    network_dhcp_end: 10.44.3.50
